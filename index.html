<script>
const PECAS = [{"nome": "MAG A750GL", "marca": "MSI", "papel": "Fonte de 750 W com selo 80 Plus.", "img": "mag-a750gl.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "MAG Coreliquid A12", "marca": "MSI", "papel": "Water cooler de 360 mm no processador.", "img": "mag-coreliquid-a12.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "B850 Gaming WiFi 6", "marca": "Gigabyte", "papel": "Onde todas as peças se encontram.", "img": "b850-gaming-wifi-6.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "Ryzen 7 9700X", "marca": "AMD", "papel": "Processa o jogo e a transmissão ao mesmo tempo.", "img": "ryzen-7-9700x.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "GeForce RTX 5070", "marca": "MSI", "papel": "Desenha o jogo e codifica o vídeo da live.", "img": "geforce-rtx-5070.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "Vengeance RGB 16GB", "marca": "Corsair", "papel": "Memória DDR5 a 5600 MHz.", "img": "vengeance-rgb-16gb.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "NV3 1TB", "marca": "Kingston", "papel": "Guarda os jogos e as gravações das lives.", "img": "nv3-1tb.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "Seis fans ARGB", "marca": "", "papel": "Tiram o calor de dentro do gabinete.", "img": "seis-fans-argb.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "Placa de captura", "marca": "", "papel": "Leva a imagem e o som do PS5 para o PC.", "img": "placa-de-captura.png", "cor": "#efa02a", "secao": "PC", "qtd": 1}, {"nome": "SC8", "marca": "FIFINE", "papel": "Mesa de som: junta PS5, PC e microfone num fone só.", "img": "sc8.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "Conch", "marca": "TRN", "papel": "Fone intra que eu uso jogando.", "img": "conch.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "Zeus X", "marca": "Redragon", "papel": "Headset de reserva.", "img": "zeus-x.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "Phantom", "marca": "SuperFrame", "papel": "Teclado mecânico.", "img": "phantom.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "X11", "marca": "Attack Shark", "papel": "Mouse.", "img": "x11.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "AM8PROT", "marca": "FIFINE", "papel": "O microfone que você ouve na live.", "img": "am8prot.png", "cor": "#9bd45f", "secao": "Periféricos", "qtd": 1}, {"nome": "AOC 24 polegadas", "marca": "AOC", "papel": "Monitor principal, 180 Hz.", "img": "aoc-24-polegadas.png", "cor": "#55c8e8", "secao": "Monitores", "qtd": 1}, {"nome": "Braço NB F80", "marca": "", "papel": "Tira os monitores da mesa e libera espaço.", "img": "bra-o-nb-f80.png", "cor": "#55c8e8", "secao": "Monitores", "qtd": 2}, {"nome": "Speed 24G2HE5", "marca": "AOC", "papel": "Monitor de apoio, onde fica o chat.", "img": "speed-24g2he5.png", "cor": "#55c8e8", "secao": "Monitores", "qtd": 1}, {"nome": "PlayStation 5 Slim", "marca": "Sony", "papel": "Onde rodam o R6 e o EA FC.", "img": "playstation-5-slim.png", "cor": "#a981f0", "secao": "Console", "qtd": 1}, {"nome": "DualSense Galactic Purple", "marca": "Sony", "papel": "Controle.", "img": "dualsense-galactic-purple.png", "cor": "#a981f0", "secao": "Console", "qtd": 1}, {"nome": "Base de carregamento", "marca": "Sony", "papel": "Deixa os controles sempre prontos.", "img": "base-de-carregamento.png", "cor": "#a981f0", "secao": "Console", "qtd": 1}, {"nome": "Hub USB de quatro portas", "marca": "", "papel": "Mais portas na frente do PS5.", "img": "hub-usb-de-quatro-portas.png", "cor": "#a981f0", "secao": "Console", "qtd": 1}, {"nome": "Mônaco BT07", "marca": "Luvinco", "papel": "Cadeira, para aguentar live longa.", "img": "m-naco-bt07.png", "cor": "#8e99ab", "secao": "Estação", "qtd": 1}, {"nome": "Mesa em L", "marca": "", "papel": "Cabe o PC, os dois monitores e o PS5.", "img": "mesa-em-l.png", "cor": "#8e99ab", "secao": "Estação", "qtd": 1}];
const painel = document.getElementById("painel");
const campos = {
  img: document.getElementById("p-img"),
  marca: document.getElementById("p-marca"),
  nome: document.getElementById("p-nome"),
  papel: document.getElementById("p-papel"),
  rodape: document.getElementById("p-rodape"),
};
const slots = [...document.querySelectorAll(".slot")];
let atual = -1;

function mostrar(i, fixar) {
  if (i === atual) return;
  atual = i;
  const p = PECAS[i];
  painel.classList.add("trocando");
  window.setTimeout(() => {
    painel.style.setProperty("--cor", p.cor);
    campos.img.src = p.img ? "img/" + p.img : "";
    campos.img.alt = p.nome;
    campos.marca.textContent = p.marca;
    campos.nome.textContent = p.nome;
    campos.papel.textContent = p.papel;
    campos.rodape.textContent = p.secao + (p.qtd > 1 ? " · " + p.qtd + " unidades" : "");
    painel.classList.remove("trocando");
  }, 140);
  if (fixar) {
    slots.forEach(s => s.removeAttribute("aria-current"));
    slots[i].setAttribute("aria-current", "true");
  }
}

slots.forEach((slot, i) => {
  slot.addEventListener("mouseenter", () => mostrar(i, true));
  slot.addEventListener("focus", () => mostrar(i, true));
  slot.addEventListener("click", () => mostrar(i, true));
});

mostrar(0, true);
</script>
